name: pr-fixes-issue
# every pull request body closes an issue (Open-Mixer/.github, pr-fixes-issue)
on:
  pull_request:
permissions:
  contents: read
jobs:
  pr-fixes-issue:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: Open-Mixer/.github/.github/workflows/pr-fixes-issue.yml@openmixer-v1
