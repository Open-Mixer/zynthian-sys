name: ci

# The fork's own scripts, checked the way they run on a device: the
# updater takes only our signed release tags, and the first install takes only
# the openmixer-release the channel signed.

on:
  pull_request:
  push:
    branches: [openmixer]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  checks:
    name: release tags and omx-fetch-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: debian:trixie
    steps:
      - name: Install the tools
        run: apt-get update -qq && apt-get install -y --no-install-recommends git gnupg gpgv curl ca-certificates systemd python3 procps shellcheck
      - uses: actions/checkout@v4
      - name: The updater takes only our signed release tags, and never rewinds
        run: tests/omx-release-tags-check.sh
      - name: plugin-hostd starts on the line it declares, and mod-host.service's start goes through it
        run: tests/plugin-hostd-ready-check.sh
      - name: The install recipe adds the plugin engine and the backend to an existing zynthian_envars.sh
        run: tests/install-openmixer-check.sh
      - name: The guitar rack example names only plugins of the bundle the recipe installs, each control a port in range
        run: tests/guitar-rack-example-check.sh
      - name: Every check script runs here, or says what device it needs
        run: tests/ci-runs-every-check.sh
      - name: The first install takes only the signed openmixer-release
        run: tests/omx-fetch-release-check.sh
      - name: Zynthian's plugin directories go to plugin-hostd.conf, and out of qualify.conf
        run: tests/omx-search-paths-check.sh
      - name: The boot cmdline enables the memory cgroup controller
        run: tests/boot-cmdline-check.sh
      - name: The UI looks set the sixteen colours and the font; stock is zynthian-ui's own; vintage is pinned
        run: |
          curl -fsSL https://raw.githubusercontent.com/Open-Mixer/zynthian-ui/openmixer/zyngui/zynthian_gui_config.py > /tmp/zynthian_gui_config.py
          ZYNTHIAN_GUI_CONFIG=/tmp/zynthian_gui_config.py tests/ui-looks-check.sh
      - name: The MOD GUI look is recorded once and omx-modgui-sync makes every bundle in it, through package updates
        run: tests/modgui-look-check.sh
      - name: The MOD GUI look script and its check pass shellcheck (warnings and errors)
        run: shellcheck -S warning sbin/omx-modgui-look.sh tests/modgui-look-check.sh
      - name: omx-zynthian-gui is staged from the base, over Zynthian's plugin bundles, noarch and reproducible
        run: tests/omx-zynthian-gui-check.sh
      - name: The omx-zynthian-gui build and its check pass shellcheck (warnings and errors)
        run: shellcheck -S warning scripts/omx-zynthian-gui-build.sh tests/omx-zynthian-gui-check.sh
      - name: The pinned keys are the ones the channel and the tags use
        run: |
          fpr() { gpg --batch --with-colons --import-options show-only --import < "$1" 2>/dev/null | awk -F: '/^pub:/ {p = 1; next} /^fpr:/ && p {print $10; p = 0}' | sort | tr '\n' ' '; }
          test "$(fpr keys/track-signing-keys.asc)" = "CDF862E9AD6220BF2516A03BFB7F93FCE4251A3A "
          curl -fsSL https://www.openmixer.org/deb/openmixer.asc > /tmp/served.asc
          test "$(fpr keys/openmixer-archive-keyring.asc)" = "$(fpr /tmp/served.asc)"

  packages:
    # arm64, the Pi's architecture: the channel's cell a Zynthian installs from
    name: the recipe's packages (debian:trixie arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    container:
      image: debian:trixie
    steps:
      - name: Install the tools
        run: apt-get update -qq && apt-get install -y --no-install-recommends gnupg gpgv curl ca-certificates
      - uses: actions/checkout@v4
      - name: The recipe's packages install from the channel and carry plugin-hostd's Python client
        run: tests/omx-packages-check.sh

  default-install:
    # arm64: the OpenMixer debs (plugin-hostd and its contract) are served for trixie arm64 only; no trixie amd64 is published
    name: OpenMixer is the default install (debian:trixie arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    container:
      image: debian:trixie
    steps:
      - name: Install the tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gnupg gpgv curl ca-certificates systemd python3 procps iproute2 fontconfig
      - uses: actions/checkout@v4
      - name: The channel and the recipe's packages are installed
        run: |
          scripts/omx-fetch-release.sh /tmp/openmixer-release.deb
          apt-get install -y -qq --no-install-recommends /tmp/openmixer-release.deb
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends openmixer-release $(sed 's/#.*//' config/openmixer-packages | xargs)
      - name: After a new image's setup, OpenMixer is the default; running the update again changes nothing
        run: |
          mkdir -p /zynthian
          cp -a "$PWD" /zynthian/zynthian-sys
          /zynthian/zynthian-sys/tests/default-install-check.sh
