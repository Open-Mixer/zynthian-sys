# After each sync, MOD GUIs from the descriptors it wrote (omx-modgui-sync.service).
[Service]
# Before each sync, Zynthian's plugin directories in plugin-hostd's settings,
# where the sync reads them (sbin/omx-search-paths.sh): an upgrade of the
# packages alone is followed too.
ExecStartPre=-#ZYNTHIAN_SYS_DIR#/sbin/omx-search-paths.sh
ExecStartPost=-/usr/bin/systemctl --no-block start omx-modgui-sync.service
